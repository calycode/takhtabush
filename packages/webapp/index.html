<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <link
         rel="icon"
         href="/favicon.ico"
         sizes="16x16 32x32 48x48"
      />
      <link
         rel="icon"
         type="image/png"
         href="/favicon.png"
         sizes="32x32"
      />
      <link
         rel="icon"
         type="image/png"
         href="/icon-192.png"
         sizes="192x192"
      />
      <link
         rel="apple-touch-icon"
         href="/apple-touch-icon.png"
      />
      <link
         rel="manifest"
         href="/site.webmanifest"
      />
      <meta
         name="theme-color"
         content="#339b5e"
      />
      <meta
         name="viewport"
         content="width=device-width, initial-scale=1.0"
      />
      <meta
         name="color-scheme"
         content="light dark"
      />
      <meta
         name="description"
         content="Takhtabush — a self-hosted flashcard learning app on one Cloudflare Worker."
      />
      <meta
         property="og:type"
         content="website"
      />
      <meta
         property="og:site_name"
         content="Takhtabush"
      />
      <meta
         property="og:title"
         content="Takhtabush"
      />
      <meta
         property="og:description"
         content="Takhtabush — a self-hosted flashcard learning app on one Cloudflare Worker."
      />
      <script>
         // Apply the saved UI skin before first paint so the standard shell never flashes.
         try {
            if (localStorage.getItem('takhtabush:ui-style') === 'pixel') {
               document.documentElement.dataset.ui = 'pixel';
            }
         } catch {
            // Private windows can block storage; the default skin still renders.
         }
      </script>
      <title>Takhtabush</title>
   </head>
   <body>
      <div id="app"></div>
      <script
         type="module"
         src="/src/main.tsx"
      ></script>
   </body>
</html>
