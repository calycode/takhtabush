name: Docs

on:
   push:
      branches: [main]
      paths:
         - 'docs/**'
         - 'scripts/docs/**'
         - 'util-resources/docs-template/**'
         - 'packages/docs/**'
         - '.github/workflows/docs-deploy.yml'
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   group: docs-deploy
   cancel-in-progress: false

jobs:
   deploy:
      runs-on: ubuntu-latest
      env:
         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
         DOCS_SITE_URL: https://takhtabush.calycode.com
      steps:
         - uses: actions/checkout@v7

         - uses: pnpm/action-setup@v6

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm

         - run: pnpm install --frozen-lockfile

         - run: pnpm docs:build

         - name: Deploy docs Worker
           if: env.CLOUDFLARE_API_TOKEN != ''
           run: pnpm --filter @caly/docs deploy

         - name: Skip deploy
           if: env.CLOUDFLARE_API_TOKEN == ''
           run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; docs were built but not deployed."
