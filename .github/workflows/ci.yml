name: CI

on:
   push:
      branches: [main]
   pull_request:

jobs:
   verify:
      runs-on: ubuntu-latest
      env:
         # Turborepo remote cache is opt-in. Empty values are tolerated: tasks
         # fall back to the local cache and never fail on this.
         TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
         TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      steps:
         - uses: actions/checkout@v7

         - uses: pnpm/action-setup@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm

         - run: pnpm install --frozen-lockfile

         - run: pnpm format:check
         - run: pnpm lint
         - run: pnpm check-types
         - run: pnpm test
         - run: pnpm build:all
         - run: pnpm docs:build
         - run: pnpm knip
         - run: pnpm db:migrate:check
