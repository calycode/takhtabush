name: CI

on:
   push:
      branches: [main]
   pull_request:

concurrency:
   group: ci-${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   verify:
      runs-on: ubuntu-latest
      env:
         # Turborepo remote cache is opt-in. Empty values are tolerated: tasks
         # fall back to the local cache and never fail on this.
         TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
         TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      steps:
         - uses: actions/checkout@v7

         - uses: pnpm/action-setup@v6

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm

         - run: pnpm install --frozen-lockfile

         - run: pnpm format:check
         - run: pnpm lint
         - run: pnpm check-types
         - run: pnpm test
         - run: pnpm build:all
         - run: pnpm docs:build
         - run: pnpm knip
         - run: pnpm db:migrate:check

   e2e:
      # The suite boots a built webapp behind `wrangler dev` with a throwaway
      # local D1/R2 database. See packages/e2e/README.md and
      # plans/003-e2e-playwright.md.
      runs-on: ubuntu-latest
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v7

         - uses: pnpm/action-setup@v6

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm

         - run: pnpm install --frozen-lockfile

         - uses: actions/cache@v4
           with:
              path: ~/.cache/ms-playwright
              key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

         - run: pnpm --filter @caly/e2e exec playwright install --with-deps chromium

         - run: pnpm e2e

         - if: failure()
           uses: actions/upload-artifact@v4
           with:
              name: playwright-report
              path: |
                 packages/e2e/.artifacts/report
                 packages/e2e/.artifacts/test-results
              retention-days: 7
