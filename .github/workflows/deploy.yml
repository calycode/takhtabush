name: Deploy

on:
   workflow_dispatch:
   push:
      branches: [main]

jobs:
   deploy:
      # Upstream auto-deploys on push. A fork can deploy manually with its own
      # secrets, but never auto-deploys upstream resources on push.
      if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'calycode'
      runs-on: ubuntu-latest
      concurrency:
         group: deploy-production
         cancel-in-progress: false
      permissions:
         contents: read
      env:
         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
         TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
         TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      steps:
         - uses: actions/checkout@v4

         - uses: pnpm/action-setup@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm

         - run: pnpm install --frozen-lockfile

         # Deploy the single unified Worker, then apply D1 migrations. Wrangler
         # can auto-provision D1/R2 when the root config has no ids.

         - run: pnpm deploy
         - run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.jsonc
