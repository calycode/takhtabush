name: Docs

on:
   push:
      branches: [main]
      paths:
         - 'docs/**'
         - 'scripts/docs/**'
         - 'util-resources/docs-template/**'
         - '.github/workflows/docs.yml'
         - 'packages/webapp/public/favicon.svg'
   workflow_dispatch:

permissions:
   contents: read
   pages: write
   id-token: write

concurrency:
   group: docs-pages
   cancel-in-progress: false

jobs:
   build:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v7

         - uses: pnpm/action-setup@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm

         - run: pnpm install --frozen-lockfile

         - run: pnpm docs:build
           env:
              DOCS_BASE: /${{ github.event.repository.name }}
              DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

         - uses: actions/configure-pages@v5

         - uses: actions/upload-pages-artifact@v3
           with:
              path: docs-site

   deploy:
      needs: build
      runs-on: ubuntu-latest
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
      steps:
         - id: deployment
           uses: actions/deploy-pages@v4
