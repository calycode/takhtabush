name: Bug report
description: Something is broken in local development or a self-hosted deployment.
title: '[bug] '
labels: ['bug']
body:
   - type: markdown
     attributes:
        value: |
           Thanks for the report. Please do not include secrets, session cookies,
           API keys, or real user data. For a security issue, use the private
           advisory link on the new-issue page instead.
   - type: dropdown
     id: deployment
     attributes:
        label: How are you running Tablinum?
        options:
           - Local development (pnpm dev)
           - Cloudflare Deploy button
           - Appflare repository install
           - Manual wrangler deploy
           - Other
     validations:
        required: true
   - type: input
     id: version
     attributes:
        label: Version or commit
        description: The tag, commit hash, or branch you are running.
     validations:
        required: true
   - type: textarea
     id: steps
     attributes:
        label: Steps to reproduce
        placeholder: |
           1. Sign in with...
           2. Open...
           3. Click...
     validations:
        required: true
   - type: textarea
     id: expected
     attributes:
        label: Expected behavior
     validations:
        required: true
   - type: textarea
     id: actual
     attributes:
        label: Actual behavior
     validations:
        required: true
   - type: textarea
     id: logs
     attributes:
        label: Relevant logs or screenshots
        description: Redact tokens, cookies, email addresses, and database ids.
        render: shell
   - type: checkboxes
     id: checks
     attributes:
        label: Before submitting
        options:
           - label: I searched existing issues.
             required: true
           - label: I removed secrets and personal data from this report.
             required: true
